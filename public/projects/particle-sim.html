<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Particle Physics Simulation · Yucheng (Jeremy) Lin</title>
<style>
  :root { --bg: #0b0d12; --panel: #141821; --text: #e7e9ee; --muted: #9aa3b2; --accent: #f0a35e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .stage { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #232937; background: #000; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 0.9rem; }
  button { background: var(--panel); color: var(--text); border: 1px solid #2a3141; border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  a { color: var(--accent); }
  body.embed main { max-width: none; padding: 0; }
  body.embed h1, body.embed main > p, body.embed .bar { display: none; }
  body.embed .stage { border: 0; border-radius: 0; height: 100vh; aspect-ratio: auto; }
  #err { display: none; position: absolute; inset: 0; padding: 24px; color: #ffb4a6; background: #000; }
</style>
</head>
<body>
<main>
  <h1>Real-Time GPU Particle Physics Simulation</h1>
  <p>A 2D physics engine running entirely in fragment shaders. Click inside the box to drop new balls (up to 100).</p>
  <div class="stage">
    <canvas id="c"></canvas>
    <div id="err"></div>
  </div>
  <div class="bar">
    <button id="reset">Reset</button>
    <span id="count"></span>
    <span>Also on <a href="https://www.shadertoy.com/view/tc3fz4" target="_blank" rel="noopener noreferrer">Shadertoy</a></span>
  </div>
</main>

<!-- Shadertoy "Common" tab -->
<script type="x-shader/x-fragment" id="common">
#define MAX_BALLS 100

const float FIXED_DT   = 1.0 / 60.0;
const vec2  GRAVITY    = vec2(0.0, -2.2);
const float AIR_DRAG   = 1.0;
const float PENALTY_K = 1000.0;
float START_COUNT = 15.0;

const float WORLD_Y_MIN = -0.5;
const float WORLD_Y_MAX = 10.0;
const float WORLD_X_MIN = -0.88;
const float WORLD_X_MAX = 0.88;

const float RESTITUTION_WALL = 0.85;
const float RESTITUTION_BALL = 0.75;
const float OVERLAP_PUSH     = 0.35;

const float FLOOR_FRICTION   = 0.90;
const float BOUNCE_KILL_Y    = 0.02;

const float GLOBAL_DAMPING   = 0.999;
const float SLEEP_SPEED2     = 1e-5;

float hash1(float x){
    return fract(sin(x * 127.1) * 43758.5453);
}

vec2 hash2(float x){
    float n = hash1(x);
    return vec2(n, hash1(x + 17.3));
}

float getBallRadius(int ballId){
    return mix(0.05, 0.11, hash1(float(ballId) * 7.1));
}

vec4 loadBallState(int ballId, sampler2D stateTex, vec2 stateRes){
    vec2 uv = (vec2(float(ballId) + 0.5, 0.5)) / stateRes;
    return texture(stateTex, uv);
}

vec4 loadControl(sampler2D stateTex, vec2 stateRes){
    vec2 uv = (vec2(float(MAX_BALLS) + 0.5, 0.5)) / stateRes;
    return texture(stateTex, uv);
}

vec2 mousePixelToWorld(vec2 mousePx, vec2 resPx){
    return (mousePx - 0.5 * resPx) / resPx.y;
}

float sdCircle(vec2 p, float r){
    return length(p) - r;
}
</script>

<!-- Shadertoy "Buffer A" tab (iChannel0 = Buffer A, previous frame) -->
<script type="x-shader/x-fragment" id="bufferA">
void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    ivec2 pixel = ivec2(floor(fragCoord));
    int width   = int(iResolution.x);
    int currentId = pixel.y * width + pixel.x;

    if (currentId > MAX_BALLS) {
        fragColor = vec4(0.0);
        return;
    }

    float activeBallCount = START_COUNT;
    float prevMouseDown   = 0.0;

    if (iFrame >= 2) {
        vec4 controlData = loadControl(iChannel0, iResolution.xy);
        activeBallCount = controlData.x;
        prevMouseDown   = controlData.y;
    }

    bool isMouseDownNow = (iMouse.z > 0.0);
    bool isNewClick     = isMouseDownNow && (prevMouseDown < 0.5);

    if (isNewClick) {
        activeBallCount = min(activeBallCount + 1.0, float(MAX_BALLS));
    }

    if (currentId == MAX_BALLS) {
        fragColor = vec4(activeBallCount, isMouseDownNow ? 1.0 : 0.0, 0.0, 0.0);
        return;
    }

    // handle ball physics
    int ballId = currentId;

    // if ball is not created, hide it
    if (float(ballId) >= activeBallCount) {
        fragColor = vec4(0.0, -999.0, 0.0, 0.0);
        return;
    }

    vec2 pos;
    vec2 vel;

    if (iFrame < 2) {
        // populate screen with few balls
        if (float(ballId) < START_COUNT) {
            vec2 r = hash2(float(ballId) * 15.43);
            pos.x = mix(WORLD_X_MIN + 0.2, WORLD_X_MAX - 0.2, r.x);
            pos.y = mix(1.0, 4.0, r.y);
            vel   = (hash2(float(ballId) * 9.1) - 0.5) * 2.0;
        } else {
            pos = vec2(0.0, -999.0);
            vel = vec2(0.0);
        }
    } else {
        vec4 state = loadBallState(ballId, iChannel0, iResolution.xy);
        pos = state.xy;
        vel = state.zw;
    }

    // create new ball on click
    int newBallId = int(activeBallCount) - 1;

    if (iFrame >= 2 && isNewClick && ballId == newBallId) {
        pos = mousePixelToWorld(iMouse.xy, iResolution.xy);
        vec2 r = hash2(float(ballId) * 23.1 + activeBallCount * 3.7);
        vel.x = mix(-1.2, 1.2, r.x);
        vel.y = mix(0.8, 2.0, r.y);
    }

    // apply physics
    float radius = getBallRadius(ballId);
    vec2 totalForce = vec2(0.0);

    totalForce += GRAVITY;

    totalForce += -AIR_DRAG * vel;

    float distFloor = pos.y - (WORLD_Y_MIN + radius);
    if (distFloor < 0.0) {
        float penetration = -distFloor;
        vec2 normal = vec2(0.0, 1.0);
        totalForce += PENALTY_K * penetration * normal;
    }

    float distLeft = pos.x - (WORLD_X_MIN + radius);
    if (distLeft < 0.0) {
        totalForce += PENALTY_K * (-distLeft) * vec2(1.0, 0.0);
    }

    float distRight = (WORLD_X_MAX - radius) - pos.x;
    if (distRight < 0.0) {
        totalForce += PENALTY_K * (-distRight) * vec2(-1.0, 0.0);
    }

    float distCeil = (WORLD_Y_MAX - radius) - pos.y;
    if (distCeil < 0.0) {
        totalForce += PENALTY_K * (-distCeil) * vec2(0.0, -1.0);
    }

    int activeInt = int(activeBallCount);

    for (int otherId = 0; otherId < 1000; otherId++) {
        if (otherId >= activeInt) break;
        if (otherId == ballId) continue;

        vec4 otherState = loadBallState(otherId, iChannel0, iResolution.xy);
        vec2 otherPos = otherState.xy;
        float otherRadius = getBallRadius(otherId);

        vec2 delta = pos - otherPos;
        float distSq = dot(delta, delta);
        float combinedRadius = radius + otherRadius;

        if (distSq < combinedRadius * combinedRadius && distSq > 0.00001) {
            float dist = sqrt(distSq);
            vec2 normal = delta / dist;
            float penetration = combinedRadius - dist;

            totalForce += PENALTY_K * penetration * normal;
        }
    }

    // update Velocity based on Force
    vel += totalForce * FIXED_DT;

    // update Position based on Velocity
    pos += vel * FIXED_DT;

    // save state
    fragColor = vec4(pos, vel);
}
</script>

<!-- Shadertoy "Image" tab (iChannel0 = Buffer A) -->
<script type="x-shader/x-fragment" id="image">
void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 world = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;

    vec3 col = vec3(0.06, 0.07, 0.10);
    col *= 0.9 + 0.1 * smoothstep(1.2, 0.2, length(world));

    float activeBallCount = loadControl(iChannel0, iResolution.xy).x;
    int activeInt = int(activeBallCount + 0.5);

    for (int ballId = 0; ballId < MAX_BALLS; ballId++) {
        if (ballId >= activeInt) break;

        vec4 state = loadBallState(ballId, iChannel0, iResolution.xy);
        vec2 pos = state.xy;
        vec2 vel = state.zw;

        float radius = getBallRadius(ballId);
        float d = sdCircle(world - pos, radius);

        float fill = smoothstep(0.01, -0.01, d);
        float glow = exp(-10.0 * max(d, 0.0) / radius);

        float speed = length(vel);
        vec3 ballColor = mix(vec3(0.4, 0.8, 1.0),
                             vec3(1.0, 0.6, 0.3),
                             smoothstep(0.0, 2.0, speed));

        col = mix(col, ballColor, fill);
        col += 0.20 * glow * ballColor;
    }

    col = pow(col, vec3(1.0/2.2));
    fragColor = vec4(col, 1.0);
}
</script>

<script>
// Minimal Shadertoy runtime: Common + Buffer A (self-feedback) + Image.
(() => {
  // ?embed shows only the simulation (for iframes and thumbnails)
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
  const canvas = document.getElementById('c');
  const errBox = document.getElementById('err');
  const fail = (msg) => { errBox.style.display = 'block'; errBox.textContent = msg; throw new Error(msg); };

  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) fail('This demo needs WebGL 2, which your browser does not support.');
  if (!gl.getExtension('EXT_color_buffer_float')) fail('This demo needs float render targets (EXT_color_buffer_float).');

  const header = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform vec3 iResolution;
uniform float iTime;
uniform int iFrame;
uniform vec4 iMouse;
uniform sampler2D iChannel0;
out vec4 shadertoy_out;
`;
  const footer = `
void main() { mainImage(shadertoy_out, gl_FragCoord.xy); }
`;
  const src = (id) => document.getElementById(id).textContent;
  const vsSrc = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

  function compile(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fragBody) {
    const pr = gl.createProgram();
    gl.attachShader(pr, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, header + src('common') + fragBody + footer));
    gl.bindAttribLocation(pr, 0, 'p');
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(pr));
    const u = {};
    for (const n of ['iResolution', 'iTime', 'iFrame', 'iMouse', 'iChannel0']) u[n] = gl.getUniformLocation(pr, n);
    return { pr, u };
  }
  const passA = program(src('bufferA'));
  const passImg = program(src('image'));

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  let targets = [], w = 0, h = 0, frame = 0, start = performance.now();
  const mouse = [0, 0, -1, -1];

  function makeTarget() {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, null);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                          [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fb };
  }
  function reset() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(160, Math.round(canvas.clientWidth * dpr));
    h = Math.max(90, Math.round(canvas.clientHeight * dpr));
    canvas.width = w; canvas.height = h;
    for (const t of targets) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
    targets = [makeTarget(), makeTarget()];
    frame = 0; start = performance.now();
  }

  function setUniforms(pass, tex) {
    gl.useProgram(pass.pr);
    gl.uniform3f(pass.u.iResolution, w, h, 1);
    gl.uniform1f(pass.u.iTime, (performance.now() - start) / 1000);
    gl.uniform1i(pass.u.iFrame, frame);
    gl.uniform4f(pass.u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(pass.u.iChannel0, 0);
  }

  const countEl = document.getElementById('count');
  const readback = new Float32Array(4);
  function render() {
    const [prev, next] = targets;
    // Buffer A: read previous frame, write next
    gl.bindFramebuffer(gl.FRAMEBUFFER, next.fb);
    gl.viewport(0, 0, w, h);
    setUniforms(passA, prev.tex);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // Image: read Buffer A
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    setUniforms(passImg, next.tex);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (frame % 15 === 0) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, next.fb);
      gl.readPixels(100, 0, 1, 1, gl.RGBA, gl.FLOAT, readback); // control pixel (id = MAX_BALLS)
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      countEl.textContent = `${Math.round(readback[0])} / 100 balls`;
    }
    targets = [next, prev];
    frame++;
    if (releasePending && frame > downFrame) release();
    requestAnimationFrame(render);
  }

  // Shadertoy iMouse: xy = position in pixels (origin bottom-left), z > 0 while the button is held
  function toPx(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * (w / r.width), (r.bottom - e.clientY) * (h / r.height)];
  }
  // A press must stay visible to Buffer A for at least one frame, or a quick click is missed.
  let downFrame = -1, releasePending = false;
  const release = () => { mouse[2] = -Math.abs(mouse[2]); mouse[3] = -Math.abs(mouse[3]); releasePending = false; };
  canvas.addEventListener('pointerdown', (e) => { const [x, y] = toPx(e); mouse[0] = x; mouse[1] = y; mouse[2] = x; mouse[3] = y; downFrame = frame; releasePending = false; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (mouse[2] > 0) { const [x, y] = toPx(e); mouse[0] = x; mouse[1] = y; } });
  const up = () => { if (frame > downFrame) release(); else releasePending = true; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  document.getElementById('reset').addEventListener('click', reset);
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(reset, 200); });

  reset();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
